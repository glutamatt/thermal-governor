[package]
name = "thermal-governor"
version = "0.1.0"
edition = "2021"
description = "Manual thermal tuning TUI and settings-keeper daemon for the ThinkPad X1 Carbon Gen 12"
license = "MIT"
repository = "https://github.com/glutamatt/thermal-governor"
keywords = ["thermal", "cpu", "governor", "thinkpad", "linux"]
categories = ["hardware-support"]

[[bin]]
name = "hw-tui"
path = "src/bin/hw_tui.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
ratatui = "0.30"
crossterm = "0.29"
libc = "0.2"
tui-bar-graph = "0.3"
colorgrad = "0.8"

[profile.release]
opt-level = "s"
lto = true
strip = true
